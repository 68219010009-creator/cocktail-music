
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCKTAIL MUSIC</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101010;
    color: white;
}

header {
    text-align: center;
    padding: 55px 20px;
    background: linear-gradient(135deg, #000000, #34250d);
    border-bottom: 2px solid #c9a227;
}

header h1 {
    color: #e4bd55;
    font-size: 42px;
    letter-spacing: 5px;
    margin-bottom: 12px;
}

header p {
    color: #ccc;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px;
}

.filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 30px;
}

.filters button {
    background: transparent;
    border: 1px solid #c9a227;
    color: #e4bd55;
    padding: 11px 23px;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
}

.filters button:hover,
.filters button.active {
    background: #c9a227;
    color: #111;
}

.music-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.music-card {
    background: #1c1c1c;
    padding: 18px;
    border: 1px solid #393026;
    border-radius: 15px;
    transition: 0.3s;
}

.music-card:hover {
    transform: translateY(-8px);
    border-color: #e4bd55;
    box-shadow: 0 8px 25px #c9a22733;
}

.music-card h2 {
    color: #e4bd55;
    margin-bottom: 15px;
    font-size: 20px;
}

.music-card iframe {
    width: 100%;
    border: none;
    border-radius: 12px;
}

.spotify-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    padding: 11px;
    background: #1ed760;
    color: #111;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
    transition: 0.3s;
}

.spotify-link:hover {
    background: #19b950;
    transform: scale(1.03);
}

footer {
    text-align: center;
    padding: 25px;
    margin-top: 40px;
    color: #888;
    border-top: 1px solid #333;
}

@media (max-width: 850px) {
    .music-list {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 550px) {
    header h1 {
        font-size: 29px;
    }

    .music-list {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>COCKTAIL MUSIC</h1>
    <p>รวมเพลงเพราะ ๆ จากวง COCKTAIL</p>
</header>

<main class="container">

    <div class="filters">
        <button class="active" data-filter="all">ทั้งหมด</button>
        <button data-filter="love">เพลงรัก</button>
        <button data-filter="sad">เพลงเศร้า</button>
        <button data-filter="hit">เพลงยอดนิยม</button>
    </div>

    <div class="music-list">

        <!-- เพลงที่ 1 -->
        <div class="music-card" data-category="sad">
            <h2>ช่างมัน</h2>
            <iframe src="https://open.spotify.com/embed/track/4ur2wxxiKJk7rLj4YYy7ej"
                height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <a class="spotify-link" href="https://open.spotify.com/track/4ur2wxxiKJk7rLj4YYy7ej" target="_blank">
                ฟังบน Spotify
            </a>
        </div>

        <!-- เพลงที่ 2 -->
        <div class="music-card" data-category="love">
            <h2>คู่ชีวิต</h2>
            <iframe src="https://open.spotify.com/embed/track/6L6MkqgAgCdlEMAXUE9j3V"
                height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <a class="spotify-link" href="https://open.spotify.com/track/6L6MkqgAgCdlEMAXUE9j3V" target="_blank">
                ฟังบน Spotify
            </a>
        </div>

        <!-- เพลงที่ 3 -->
        <div class="music-card" data-category="love">
            <h2>เธอ</h2>
            <iframe src="https://open.spotify.com/embed/track/3HlTt5df6OrvtwTvO6iFla"
                height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <a class="spotify-link" href="https://open.spotify.com/track/3HlTt5df6OrvtwTvO6iFla" target="_blank">
                ฟังบน Spotify
            </a>
        </div>

        <!-- เพลงที่ 4 -->
        <div class="music-card" data-category="love">
            <h2>โปรดเถิดรัก</h2>
            <iframe src="https://open.spotify.com/embed/track/4fneLTeSAdRcYiUi95Tw6P"
                height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <a class="spotify-link" href="https://open.spotify.com/track/4fneLTeSAdRcYiUi95Tw6P" target="_blank">
                ฟังบน Spotify
            </a>
        </div>

        <!-- เพลงที่ 5 -->
        <div class="music-card" data-category="hit">
            <h2>ดึงดัน</h2>
            <iframe src="https://open.spotify.com/embed/track/7JaPPOOC2r2yeJ0GdykPeE"
                height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <a class="spotify-link" href="https://open.spotify.com/track/7JaPPOOC2r2yeJ0GdykPeE" target="_blank">
                ฟังบน Spotify
            </a>
        </div>

        <!-- เพลงที่ 6 -->
        <div class="music-card" data-category="hit">
            <h2>งานเต้นรำในคืนพระจันทร์เต็มดวง</h2>
            <iframe src="https://open.spotify.com/embed/track/7o9Rys39g1EaRhXtM5BsQa"
                height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            <a class="spotify-link" href="https://open.spotify.com/track/7o9Rys39g1EaRhXtM5BsQa" target="_blank">
                ฟังบน Spotify
            </a>
        </div>

    </div>
</main>

<footer>
    <p>© 2026 COCKTAIL MUSIC | Music Website Project</p>
</footer>

<script>
const filterButtons = document.querySelectorAll(".filters button");
const musicCards = document.querySelectorAll(".music-card");

filterButtons.forEach(button => {
    button.addEventListener("click", () => {

        filterButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");

        const filter = button.dataset.filter;

        musicCards.forEach(card => {
            if (filter === "all" || card.dataset.category === filter) {
                card.style.display = "block";
            } else {
                card.style.display = "none";
            }
        });
    });
});
</script>

</body>
</html>
